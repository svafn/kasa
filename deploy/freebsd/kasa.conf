# Налаштування касової книги на сервері FreeBSD.
# Єдине місце, де вказуються шляхи: решта скриптів читають цей файл.
# Формат — POSIX sh, тому: без пробілів навколо «=», значення в лапках.

# --- шляхи
APP_DIR="/home/sva/ft/kasa/kasa"                 # тека з проєктом (тут run_server.py)
VENV_DIR="/home/sva/ft/kasa/vkasa"           # віртуальне оточення
RUN_DIR="/home/sva/ft/kasa/kasa/var"             # pid-файли й lock (має бути на запис)
LOG_DIR="/home/sva/ft/kasa/kasa/logs"
BACKUP_DIR="/home/sva/backup/kasa"           # резервні копії БД

# --- мережа
PORT="5005"
# 127.0.0.1 — якщо попереду nginx (рекомендовано);
# 0.0.0.0    — прямий доступ до застосунку з мережі.
BIND_HOST="0.0.0.0"

# --- сервер застосунків: waitress | gevent | auto
SERVER="waitress"
THREADS="8"

# --- інше
TZ="Europe/Kiev"
BACKUP_KEEP_DAYS="60"                        # скільки днів зберігати копії БД
HTTP_FAIL_LIMIT="3"
HTTP_TIMEOUT="30"
START_GRACE="60"
